version: "3.9"

# ============================================
# DeployDock - Production Docker Compose
# ============================================
# Orchestrates the 3 core services:
#   1. backend  - FastAPI (Python) API server
#   2. frontend - Vue.js SPA served via Nginx
#   3. db       - PostgreSQL 16 database

services:
  # -------------------------------------------
  # Backend - FastAPI Application
  # -------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deploydock-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repos_data:/app/repos
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://deploydock:deploydock@db:5432/deploydock}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-changeme}
      - DOCKER_HOST=${DOCKER_HOST:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
      - REPOS_BASE_PATH=/app/repos
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-30}
      - HEALTH_CHECK_RETRIES=${HEALTH_CHECK_RETRIES:-3}
      - APPS_BASE_DOMAIN=${APPS_BASE_DOMAIN:-localhost}
      - APPS_TLS_ENABLED=${APPS_TLS_ENABLED:-false}
      - PROXY_HTTP_PORT=${PROXY_HTTP_PORT:-80}
      - PROXY_HTTPS_PORT=${PROXY_HTTPS_PORT:-443}
      - APPS_NETWORK=${APPS_NETWORK:-deploydock-apps}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@deploydock.local}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-admin123}
    networks:
      - deploydock-net
      - deploydock-apps
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -------------------------------------------
  # Frontend - Vue.js SPA via Nginx
  # -------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: deploydock-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - deploydock-net
      - deploydock-apps
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=deploydock-apps"
      - "traefik.http.routers.deploydock.rule=Host(`${DEPLOYDOCK_HOST:-localhost}`)"
      - "traefik.http.routers.deploydock.entrypoints=web"
      - "traefik.http.services.deploydock.loadbalancer.server.port=80"
      - "traefik.http.routers.deploydock-secure.rule=Host(`${DEPLOYDOCK_HOST:-localhost}`)"
      - "traefik.http.routers.deploydock-secure.entrypoints=websecure"
      - "traefik.http.routers.deploydock-secure.tls=true"
      - "traefik.http.routers.deploydock-secure.tls.certresolver=letsencrypt"

  # -------------------------------------------
  # Database - PostgreSQL 16
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: deploydock-db
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-deploydock}
      - POSTGRES_USER=${POSTGRES_USER:-deploydock}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deploydock}
    networks:
      - deploydock-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deploydock} -d ${POSTGRES_DB:-deploydock}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------
  # Proxy Reverso Dinâmico - Traefik
  # -------------------------------------------
  # Roteia automaticamente cada projeto para sua URL (ex: meusite.localhost ou meusite.seudominio.com)
  # Em produção com APPS_TLS_ENABLED=true, emite certificados SSL/TLS Let's Encrypt automaticamente
  traefik:
    image: traefik:v3.6
    container_name: deploydock-traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@localhost}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - deploydock-apps

# -------------------------------------------
# Named Volumes
# -------------------------------------------
volumes:
  pg_data:
    driver: local
  repos_data:
    driver: local
  traefik_certs:
    driver: local

# -------------------------------------------
# Networks
# -------------------------------------------
networks:
  deploydock-net:
    driver: bridge
  deploydock-apps:
    name: deploydock-apps
    driver: bridge
